# 이 워크플로우는 main 브랜치의 'data/' 디렉토리 내 변경 사항을 감지하여 
# api-data 브랜치로 동기화(배포)하고, 관련된 프론트엔드 리포지토리들에 빌드/캐시 갱신 트리거를 전송합니다.
name: Sync Data to api-data Branch

on:
  push:
    branches:
      - main
    paths:
      - 'data/**' # 원본 데이터 또는 아래 워크플로 설정이 변경되면 실행합니다.
      - '.github/workflows/sync-api-data.yml'
  workflow_dispatch: # 관리자가 GitHub Action 페이지에서 수동으로 워크플로우를 즉시 실행할 수 있도록 지원합니다.

# GitHub Actions 환경에서 리포지토리 쓰기 및 Pages 배포를 수행하기 위한 권한 정의
permissions:
  contents: write   # api-data 브랜치로 동기화된 코드 푸시를 위해 필수
  pages: write      # GitHub Pages 배포를 위한 쓰기 권한
  id-token: write   # GitHub Pages 배포 시 안전한 OIDC 토큰 검증을 위한 권한

# 동일 워크플로우가 여러 번 실행될 경우 배포 충돌을 방지하기 위한 동시성 설정
concurrency:
  group: "pages"
  cancel-in-progress: true # 오래된 대기 실행을 취소하고 최신 데이터의 배포를 진행합니다.

jobs:
  # [1단계] main의 최신 데이터를 api-data 브랜치로 동기화하는 작업
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 동기화에 필요한 main과 api-data 브랜치를 함께 가져옵니다.
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # api-data의 기존 커밋 위에 데이터 변경을 반영합니다.

      # Git 자동 커밋을 수행할 로봇 계정 정보 설정
      - name: Git identity configuration
        run: |
          git config --global user.name "ablo-bot"
          git config --global user.email "bot@ablo.dot.kr"

      # 변경 사항을 api-data 브랜치에 반영하는 핵심 스크립트
      - name: Sync data to api-data branch
        run: |
          # 1. api-data 브랜치가 있으면 가져오고 없으면 새로 만듭니다.
          git checkout -B api-data origin/api-data || git checkout -b api-data
          
          # 2. main 브랜치에서 업데이트된 data/ 폴더 최신 내용만 가져옵니다.
          git checkout main -- data/
          
          # 3. 변경 내용이 있을 때에만 커밋 후 강제 푸시합니다.
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S') 데이터 자동 업데이트"
            git push origin api-data --force
            echo "[✔] api-data 브랜치 동기화 완료"
          else
            echo "[*] 데이터 변경 사항이 없습니다."
          fi

  # [2단계] 동기화된 데이터를 바탕으로 GitHub Pages 배포 및 연동 리포지토리 트리거 작동
  deploy_and_trigger:
    needs: sync_data # 1단계(데이터 동기화)가 정상 종료되어야 실행됩니다.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 동기화된 최신 상태의 api-data 브랜치를 가져옵니다.
      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data

      # GitHub Pages 배포 규격에 맞게 환경 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Static 호스팅을 위해 data/ 디렉토리 자체를 배포 아티팩트로 만듭니다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # api.swedding.kr/weddinggo/... 와 같은 정적 주소로 JSON 데이터에 바로 접근 가능하도록 설정
          path: './data'

      # 정적 호스팅 사이트에 데이터 반영 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 배포 성공 후 모든 프론트엔드를 갱신해 취소된 실행의 데이터 변경도 반영합니다.
      # [트리거 A] wedding-html 프론트엔드 빌드 갱신
      - name: Trigger Frontend Revalidation (wedding-html)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/wedding-html
          event-type: api_data_updated

      # [트리거 B] GyeolhonExpo 프론트엔드 빌드 갱신
      - name: Trigger Frontend Revalidation (GyeolhonExpo)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/GyeolhonExpo
          event-type: api_data_updated

      # [트리거 C] WeddingDay 프론트엔드 빌드 갱신
      - name: Trigger Frontend Revalidation (WeddingDay)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/WeddingDay
          event-type: api_data_updated

      # [트리거 D] WeddingHub 프론트엔드 빌드 갱신
      - name: Trigger Frontend Revalidation (WeddingHub)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/WeddingHub
          event-type: api_data_updated

      # [트리거 E] WeddingExpo 프론트엔드 빌드 갱신
      - name: Trigger Frontend Revalidation (WeddingExpo)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/WeddingExpo
          event-type: api_data_updated
