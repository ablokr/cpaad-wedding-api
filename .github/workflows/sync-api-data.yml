name: Sync Data to api-data Branch

on:
  push:
    branches:
      - main
    paths:
      - 'data/**' # data/ 디렉토리 내 파일 변경 시에만 실행
  workflow_dispatch: # 수동 실행 기능 추가

permissions:
  contents: write
  pages: write
  id-token: write

# 환경 변수 동시성 설정 (배포 중복 방지, 연속 실행 시 기존 작업 취소하여 아티팩트 중복 방지)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync_data:
    runs-on: ubuntu-latest
    outputs:
      weddinggo_changed: ${{ steps.changed-files.outputs.weddinggo_any_changed }}
      weddingExpo_changed: ${{ steps.changed-files.outputs.weddingExpo_any_changed }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 모든 브랜치 정보를 가져오기 위함

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files_yaml: |
            weddinggo:
              - data/weddinggo/**
            weddingExpo:
              - data/weddingExpo/**

      - name: Git identity configuration
        run: |
          git config --global user.name "ablo-bot"
          git config --global user.email "bot@ablo.dot.kr"

      - name: Sync data to api-data branch
        run: |
          # 1. api-data 브랜치가 존재하는지 확인하고 체크아웃
          git checkout -B api-data origin/api-data || git checkout -b api-data
          
          # 2. main 브랜치의 data/ 폴더 내용만 덮어쓰기
          git checkout main -- data/
          
          # 3. 변경사항 여부 확인 및 푸시
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S') 데이터 자동 업데이트"
            git push origin api-data --force
            echo "[✔] api-data 브랜치 동기화 완료"
          else
            echo "[*] 데이터 변경 사항이 없습니다."
          fi

  deploy_and_trigger:
    needs: sync_data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # data/ 폴더 자체를 루트로 배포 (api.swedding.kr/weddinggo/... 로 접근 가능)
          path: './data'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Frontend Revalidation (wedding-html)
        if: success() && (needs.sync_data.outputs.weddinggo_changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/wedding-html
          event-type: api_data_updated

      - name: Trigger Frontend Revalidation (GyeolhonExpo)
        if: success() && (needs.sync_data.outputs.weddingExpo_changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/GyeolhonExpo
          event-type: api_data_updated
