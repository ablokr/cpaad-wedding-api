name: Sync Data to api-data Branch

on:
  push:
    branches:
      - main
    paths:
      - 'data/**' # data/ 디렉토리 내 파일 변경 시에만 실행
  workflow_dispatch: # 수동 실행 기능 추가

permissions:
  contents: write
  pages: write
  id-token: write

# 환경 변수 동시성 설정 (배포 중복 방지)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 모든 브랜치 정보를 가져오기 위함

      - name: Git identity configuration
        run: |
          git config --global user.name "ablo-bot"
          git config --global user.email "bot@ablo.dot.kr"

      - name: Sync data to api-data branch
        run: |
          # 1. api-data 브랜치가 존재하는지 확인하고 체크아웃
          git checkout -B api-data origin/api-data || git checkout -b api-data
          
          # 2. main 브랜치의 data/ 폴더 내용만 덮어쓰기
          git checkout main -- data/
          
          # 3. 변경사항 여부 확인 및 푸시
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S') 데이터 자동 업데이트"
            git push origin api-data --force
            echo "[✔] api-data 브랜치 동기화 완료"
          else
            echo "[*] 데이터 변경 사항이 없습니다."
          fi

  deploy_and_trigger:
    needs: sync_data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout api-data branch
        uses: actions/checkout@v4
        with:
          ref: api-data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # api-data 브랜치 전체를 배포 (api.swedding.kr/data/... 로 접근 가능)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Frontend Revalidation (wedding-html)
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEDDINGGO_PAT_TOKEN }}
          repository: ablokr/wedding-html
          event-type: api_data_updated
